[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["patches"]
default-members = ["crates/neon"]

[workspace.package]
edition = "2024"
version = "0.6.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "0.7.3", features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
] }
markdown = { path = "crates/markdown" }
workspace = { path = "crates/workspace" }
markdown_preview = { path = "crates/markdown_preview" }
export = { path = "crates/export" }
pulldown-cmark = { version = "0.13", default-features = false }
anyhow = "1"

[profile.dev]
# GPUI is slow unoptimized; optimize dependencies even in dev builds so
# typing and scrolling feel representative while iterating.
debug = "limited"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# block 0.1.6, the last release, declares a static of an empty enum, which a
# future Rust will reject (rust#74840). GPUI pulls it in through cocoa and
# metal. patches/block is that release with only the type changed.
[patch.crates-io]
block = { path = "patches/block" }
# gpui-pre-apple 0.3.9 resolves bold and italic only to faces a font family
# ships, so a family without them (most CJK fonts have no italic, many no
# bold) draws regular text. The patch synthesizes the missing face; see
# patches/gpui-pre-apple/PATCH.md.
gpui-pre-apple = { path = "patches/gpui-pre-apple" }
