[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["patches"]
default-members = ["crates/neon"]

[workspace.package]
edition = "2024"
version = "0.16.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "0.7.3", features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    # Grammars for fenced code blocks, in the editor and the preview. JSON
    # is always built in. Each grammar adds to the binary; Kotlin, C#,
    # Swift, Ruby and PHP would add about 19 MB, so they are left out.
    # Keep in step with `code_highlight::NAMES`.
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
markdown = { path = "crates/markdown" }
workspace = { path = "crates/workspace" }
markdown_preview = { path = "crates/markdown_preview" }
export = { path = "crates/export" }
pulldown-cmark = { version = "0.13", default-features = false }
anyhow = "1"

[profile.dev]
# GPUI is slow unoptimized; optimize dependencies even in dev builds so
# typing and scrolling feel representative while iterating.
debug = "limited"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Fat LTO, aborting on panic and stripping symbols take the arm64 binary from
# 30.1 to 16.2 MB. Aborting changes no behavior: GPUI runs every callback and
# task through extern "C" functions, so a panic already ends the process.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# block 0.1.6, the last release, declares a static of an empty enum, which a
# future Rust will reject (rust#74840). GPUI pulls it in through cocoa and
# metal. patches/block is that release with only the type changed.
[patch.crates-io]
block = { path = "patches/block" }
