[package]
name = "workspace"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
memory-bench = ["dep:anyhow"]
diagnostics = ["gpui-kit/profiler"]

[dependencies]
gpui-kit.workspace = true
lsp-types = { version = "0.97", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markdown_preview.workspace = true
markdown.workspace = true
pulldown-cmark.workspace = true
export.workspace = true
tree-sitter = "0.26"
# Both already built for GPUI Kit: the folder search's matcher and threads.
regex = "1"
rayon = "1"
anyhow = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "FoundationErrors",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
