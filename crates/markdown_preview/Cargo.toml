[package]
name = "markdown_preview"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
markdown.workspace = true
# Already built for GPUI Kit's highlighter; only its edit type is used.
tree-sitter = "0.26"
# Already linked through GPUI; only used to shrink oversized decoded images.
image = { version = "0.25", default-features = false }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
