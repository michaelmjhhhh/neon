<!doctype html>
<!-- Source for og.png, the 1200x630 link preview. Regenerate from the site folder with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=assets/og.png assets/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url(fonts/fraunces.woff2) format("woff2"); font-weight: 560; }
@font-face { font-family: "Bricolage Grotesque"; src: url(fonts/bricolage-grotesque.woff2) format("woff2"); font-weight: 400 600; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background: #16171B;
  color: #F4F3F1;
  font-family: "Bricolage Grotesque", sans-serif;
  display: grid;
  grid-template-columns: 1fr 360px;
  align-items: center;
  gap: 40px;
  padding: 0 90px;
  box-sizing: border-box;
}
h1 { font: 560 76px/1.02 "Fraunces", serif; letter-spacing: -.02em; margin: 0; }
p { margin: 28px 0 0; font-size: 28px; color: #A3A5AD; }
img { width: 360px; height: 360px; }
</style>
</head>
<body>
  <div>
    <h1>The Markdown editor that keeps up with you</h1>
    <p>Neon, a fast, native Markdown editor for macOS</p>
  </div>
  <img src="icon-512.png" alt="">
</body>
</html>
